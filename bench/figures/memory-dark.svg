<text x="62.0" y="34.0" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Gateway memory while 10GiB streams through it</text>
<text x="62.0" y="54.0" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">Resident set of the gateway process. The scale is the claim, not the shape: memory follows how many streams are in flight, never how large they are.</text>
