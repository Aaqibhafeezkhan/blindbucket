# Local development upstream. Start with: docker compose up -d
#
# MinIO is published on host port 9002, not its default 9000, so that a locally
# running `blindbucket serve` can keep :9000 (the port used in blindbucket.yaml).
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"   # S3 API
      - "9091:9091"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the buckets the integration tests and the quickstart expect.
  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/blindbucket-dev &&
      mc mb --ignore-existing local/blindbucket-test
      "

volumes:
  minio-data:
