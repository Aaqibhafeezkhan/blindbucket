name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GOTOOLCHAIN=local forbids Go from silently downloading a newer toolchain, so a
# job that says it builds on the declared floor really does. Jobs that run a
# tool rather than the project override the Go version instead.
env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      # v8 of the action is the one that speaks golangci-lint v2; earlier
      # versions install a v1 binary, which rejects this repository's config.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "1.24" is the declared floor: crypto/hkdf arrived there, and the
        # dependencies are pinned to releases that still build with it.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test -race -count=1 ./...

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Short runs on every push; the nightly workflow runs them for 15 minutes
      # each. Seed corpora under testdata/ are exercised by `go test` regardless.
      - run: make fuzz FUZZTIME=30s

  integration:
    name: Integration (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # MinIO is started with an explicit command rather than as a service
      # container, because it needs one ("server /data") and services cannot
      # supply it.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9002/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:9002/minio/health/live >/dev/null
      - name: Create the test bucket
        run: |
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:latest -c \
            "mc alias set local http://localhost:9002 minioadmin minioadmin && \
             mc mb --ignore-existing local/blindbucket-test"
      - name: Run the integration tests
        env:
          BLINDBUCKET_TEST_S3_ENDPOINT: http://localhost:9002
        run: go test -race -count=1 ./internal/upstream/... ./internal/proxy/...
      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # govulncheck itself requires a newer Go than this module's floor, so this
      # job builds the tool with current Go. It still analyses the module as
      # declared.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
