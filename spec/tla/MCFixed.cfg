\* The design under test: R1-R4 from ADR-010 and the conditional
\* write from ADR-009.  Three concurrent uploads, a single-part PUT, a delete,
\* one rotation and one gc pass, all on the same key, with a crash possible
\* after every step.  TLC must find no violation.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    u2 = u2
    u3 = u3
    Uploads     = {u1, u2, u3}
    CleanupMode = "r3"
    GcMode      = "r4"
    RotateMode  = "conditional"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
